name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "8.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.6.3
          use-dotnet: true

      - name: Format check
        run: dotnet format --verify-no-changes neumann-orbital.csproj

      - name: Build
        run: dotnet build neumann-orbital.csproj -warnaserror

      - name: Build release
        run: dotnet build neumann-orbital.csproj --configuration Release -warnaserror

      - name: Import assets
        run: godot --headless --import
